<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>digiRupee Android APK</title>
  <style>
    :root{--bg:#080611;--card:#141022;--line:#2d2546;--text:#f8f5ff;--muted:#aaa2bd;--purple:#8b5cf6;--gold:#f2cf70}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#2b1857 0,transparent 42%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(460px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(20,16,34,.95);box-shadow:0 28px 80px #0008;text-align:center}
    .logo{width:64px;height:64px;margin:auto;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#9b75ff,#5d35c8);font-size:30px;font-weight:900}
    h1{margin:18px 0 8px;font-size:29px}p{margin:0;color:var(--muted);line-height:1.65}
    .download{display:block;width:100%;margin:26px 0 12px;padding:15px 18px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--purple),#6d42d8);color:white;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}
    .ref{display:none;margin:14px 0 0;padding:11px 13px;border:1px solid #493a70;border-radius:11px;background:#100c1c;color:#d9d1e8;font-size:13px;line-height:1.5}
    .ref.show{display:block}.ref b{color:var(--gold)}
    .admin{display:inline-block;margin-top:14px;color:var(--gold);text-decoration:none;font-weight:700}
    small{display:block;margin-top:22px;color:#7f778f}
  </style>
</head>
<body>
  <main>
    <div class="logo">₹</div>
    <h1>digiRupee for Android</h1>
    <p>digiRupee is available only as an Android application. Download the latest installable APK below.</p>
    <div class="ref" id="refNotice">Referral detected: <b id="refCode"></b>. It will be applied automatically when you open the app after installation.</div>
    <button class="download" id="downloadButton" type="button">Download Android APK</button>
    <a class="admin" href="/admin">digiRupee Admin Login</a>
    <small>Official distribution · digirupee.loktron.com</small>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const referral = String(params.get('ref') || '').trim().toUpperCase();
      const validReferral = /^DGR[A-F0-9]{10}$/.test(referral) ? referral : '';
      const button = document.getElementById('downloadButton');
      if (validReferral) {
        document.getElementById('refCode').textContent = validReferral;
        document.getElementById('refNotice').classList.add('show');
      }

      async function copyReferralMarker() {
        if (!validReferral) return;
        const marker = `DIGIRUPEE_REF:${validReferral}`;
        try {
          await navigator.clipboard.writeText(marker);
          return;
        } catch {}
        const input = document.createElement('textarea');
        input.value = marker;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); } catch {}
        input.remove();
      }

      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = 'Preparing download…';
        await copyReferralMarker();
        const target = validReferral
          ? `/download/digirupee.apk?ref=${encodeURIComponent(validReferral)}`
          : '/download/digirupee.apk';
        location.href = target;
        setTimeout(() => {
          button.disabled = false;
          button.textContent = 'Download Android APK';
        }, 1800);
      });
    })();
  </script>
</body>
</html>
