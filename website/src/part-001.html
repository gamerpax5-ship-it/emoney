<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>LOKTRON — Buy USDT with INR</title>
<meta content="LOKTRON — professional INR to USDT purchase platform with bank transfer, payment proof, order tracking and account dashboard." name="description"/>
<style>
:root{
  --bg:#06131c; --bg2:#0a1d29; --ink:#10213a; --text:#f7fbff; --muted:#91a7b8;
  --surface:#ffffff; --surface2:#f6f8ff; --line:#dfe7f1;
  --purple:#6d5dfc; --purple2:#8a79ff; --cyan:#13c7d8; --ocean:#0d96c8; --blue:#4c7ff8;
  --green:#19bb7a; --red:#ee5366; --amber:#f5b64a;
  --shadow:0 24px 80px rgba(20,58,92,.18);
  --shadow2:0 16px 40px rgba(44,84,124,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(109,93,252,.18),transparent 28%),
radial-gradient(circle at 92% 5%,rgba(19,199,216,.18),transparent 26%),
#f7fbff;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.wrap{width:min(1220px,calc(100% - 36px));margin:auto}
.hidden{display:none!important}

/* ---------- PUBLIC NAV ---------- */
.topnav{position:sticky;top:0;z-index:60;background:rgba(248,252,255,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(140,168,194,.18)}
.navin{height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:white;font-weight:950;font-size:18px;background:linear-gradient(145deg,var(--purple),var(--cyan));box-shadow:0 12px 28px rgba(84,104,239,.28);transform:perspective(500px) rotateX(8deg) rotateY(-8deg)}
.brand b{font-size:20px;letter-spacing:.2px}
.brand small{display:block;color:#748aa0;font-size:10px;margin-top:1px}
.navlinks{display:flex;gap:24px;font-size:13px;color:#546c83}
.navlinks a:hover{color:var(--purple)}
.actions{display:flex;gap:10px}
.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:850;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px)}
.btn.primary{color:white;background:linear-gradient(100deg,var(--purple),var(--blue),var(--cyan));box-shadow:0 10px 28px rgba(70,113,240,.26)}
.btn.secondary{background:white;color:#304b67;border:1px solid #dbe5ef;box-shadow:0 7px 20px rgba(62,89,115,.08)}
.btn.dark{background:#0f2130;color:white;border:1px solid #253e50}
.btn.full{width:100%}

/* ---------- HERO ---------- */
.hero{padding:76px 0 44px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:linear-gradient(90deg,rgba(109,93,252,.08),rgba(19,199,216,.08));border:1px solid rgba(109,93,252,.18);color:#5d58d6;font-weight:900;font-size:11px;letter-spacing:.7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(25,187,122,.09)}
h1{font-size:68px;line-height:.96;letter-spacing:-3.2px;margin:18px 0 18px}
.gradient-text{background:linear-gradient(95deg,#5c50f4 5%,#3e86f6 50%,#12bfd3 100%);-webkit-background-clip:text;color:transparent}
.lead{font-size:17px;line-height:1.72;color:#60758a;max-width:650px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}
.hero-trust{display:flex;gap:20px;flex-wrap:wrap;margin-top:25px;color:#5d7287;font-size:12px}
.hero-trust span{display:flex;gap:7px;align-items:center}.hero-trust i{font-style:normal;color:var(--green)}

/* 3D visual */
.visual{position:relative;min-height:510px;perspective:1200px}
.glow{position:absolute;inset:55px 20px 30px;background:radial-gradient(circle at 50% 45%,rgba(52,194,223,.28),rgba(109,93,252,.15) 42%,transparent 72%);filter:blur(12px)}
.orb{position:absolute;border-radius:50%;filter:drop-shadow(0 20px 35px rgba(38,75,110,.22))}
.orb.one{width:92px;height:92px;right:35px;top:34px;background:radial-gradient(circle at 32% 26%,#fff,#9fe7f1 33%,#18b7d0 73%,#1074a6 100%);animation:float 5.8s ease-in-out infinite}
.orb.two{width:60px;height:60px;left:34px;bottom:72px;background:radial-gradient(circle at 32% 28%,#fff,#b4acff 36%,#6d5dfc 75%,#4638bf);animation:float 6.5s ease-in-out infinite .7s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.trade3d{position:absolute;left:50%;top:50%;width:385px;transform:translate(-50%,-50%) rotateY(-8deg) rotateX(5deg);transform-style:preserve-3d}
.trade3d:before{content:"";position:absolute;inset:26px -18px -26px 26px;border-radius:32px;background:linear-gradient(145deg,rgba(13,150,200,.18),rgba(109,93,252,.19));filter:blur(4px);transform:translateZ(-40px)}
.trade-shell{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(241,247,255,.95));border:1px solid rgba(139,166,201,.28);border-radius:30px;padding:20px;box-shadow:0 38px 90px rgba(34,68,104,.24)}
.trade-top{display:flex;justify-content:space-between;align-items:center}
.token-icon{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#29b78d,#10d8c5);color:white;font-weight:950;font-size:23px;box-shadow:0 14px 28px rgba(22,177,154,.25)}
.ratebig{font-size:28px;font-weight:950;color:#162a41;margin-top:3px}
.small{font-size:10px;color:#72879b}
.statuspill{font-size:9px;padding:6px 9px;border-radius:999px;font-weight:850}.statuspill.live{color:#14845a;background:#e9fbf4;border:1px solid #bfecd8}.statuspill.soon{color:#976d1c;background:#fff8df;border:1px solid #f2dfaa}
.fake-input{margin-top:15px;padding:14px;border-radius:15px;background:#f8fbff;border:1px solid #dce7f0;display:flex;justify-content:space-between}
.quote3d{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.q3{padding:12px;border-radius:14px;background:linear-gradient(160deg,#eef2ff,#f4fcff);border:1px solid #dde6f4}.q3 b{display:block;font-size:14px;margin-top:4px}
.mini-bank{margin-top:12px;padding:14px;border-radius:15px;background:#0f2030;color:white;box-shadow:0 15px 30px rgba(9,31,47,.15)}.mini-bank .row{display:flex;justify-content:space-between;font-size:9px;color:#abc0cf;margin:6px 0}.mini-bank strong{color:white}

/* ---------- LANDING CONTENT ---------- */
.stats{padding:14px 0 60px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:white;border:1px solid #e1e9f1;border-radius:18px;padding:20px;box-shadow:0 12px 28px rgba(63,93,120,.06)}.stat b{font-size:25px}.stat small{display:block;color:#7b90a3;margin-top:5px}
.section{padding:76px 0}.section.tint{background:linear-gradient(180deg,#f1f7ff,#f7fbff)}
.section-head{max-width:800px;text-align:center;margin:0 auto 34px}.section-head .kicker{font-size:11px;color:#655af0;font-weight:900;letter-spacing:.8px}.section-head h2{font-size:42px;line-height:1.08;letter-spacing:-1.5px;margin:9px 0 10px}.section-head p{color:#6f8397;line-height:1.7;margin:0}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feature{background:white;border:1px solid #e0e8f1;border-radius:20px;padding:21px;box-shadow:0 14px 34px rgba(62,93,122,.07);transition:.18s}.feature:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(62,93,122,.11)}
.fi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:white;font-weight:950;background:linear-gradient(145deg,var(--purple),var(--cyan));box-shadow:0 11px 24px rgba(78,100,223,.22)}.feature h3{font-size:15px;margin:14px 0 7px}.feature p{font-size:11px;line-height:1.65;color:#75899c;margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{background:white;border:1px solid #e0e8f1;border-radius:20px;padding:20px}.step .num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:white;font-weight:900;background:linear-gradient(145deg,var(--purple),var(--ocean))}.step h3{font-size:14px;margin:13px 0 6px}.step p{font-size:10.5px;color:#778b9e;line-height:1.6}
.currency-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.currency{padding:18px;border-radius:20px;background:white;border:1px solid #e0e8f1}.currency-top{display:flex;justify-content:space-between;align-items:center}.currency-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:white;font-size:18px;font-weight:950;background:linear-gradient(145deg,#6d5dfc,#12bcd1)}.currency h3{font-size:14px;margin:12px 0 5px}.currency p{font-size:10px;color:#7f92a5;line-height:1.55}
