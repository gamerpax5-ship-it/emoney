name: Polish digiRupee auth v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-auth-v2-readability.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 .github/oneoff_auth_patch.py

      - name: Validate
        run: |
          node --check ui/digirupee-app.js
          node --check ui/digirupee-layout-v3.js
          node --check ui/digirupee-rewards.js
          node --check scripts/prepare-assets.mjs
          npm run prepare-assets
          node --check website/digirupee-app.js
          node --check website/digirupee-layout-v3.js
          node --check website/digirupee-rewards.js
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          grep -q 'digi-usdt-svg' ui/digirupee-app.js
          grep -q 'id="digiRegisterFields" class="digi-auth-register-fields"' ui/digirupee-app.js
          grep -q 'Readability V4: mobile-readable secondary text' ui/digirupee-layout-v3.js
          grep -q 'Readability V4: readable secondary Rewards copy' ui/digirupee-rewards.js
          grep -q 'v=20260915c' scripts/prepare-assets.mjs

      - name: Keep canonical changes only
        run: |
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          git diff --check

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-assets.mjs ui/digirupee-app.js ui/digirupee-layout-v3.js ui/digirupee-rewards.js
          git rm .github/workflows/oneoff-auth-v2-readability.yml .github/oneoff_auth_patch.py
          git commit -m 'Refine digiRupee auth and raise mobile readability'
          git push origin HEAD:main
