name: Update LOKTRON fiat currencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-loktron-fiat-currencies.yml'
      - '.github/scripts/oneoff_loktron_fiat.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/oneoff_loktron_fiat.py
      - name: Validate
        shell: bash
        run: |
          node --check website/server.mjs
          node website/assemble-src.mjs
          grep -q 'BDT — Bangladeshi Taka' website/index.html
          grep -q 'PKR — Pakistani Rupee' website/index.html
          grep -q 'CNY — Chinese Yuan' website/index.html
          grep -q 'INR and USD live' website/index.html
          if grep -q 'Tether USD' website/server.mjs; then exit 1; fi
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
      - name: Keep canonical files only
        shell: bash
        run: |
          git restore website/index.html 2>/dev/null || true
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'website/server.mjs' 'website/src/part-007.html' 'website/src/part-010.html' | sort)"
          test "$changed" = "$expected"
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/server.mjs website/src/part-007.html website/src/part-010.html
          git rm .github/workflows/oneoff-loktron-fiat-currencies.yml .github/scripts/oneoff_loktron_fiat.py
          git commit -m 'Expand LOKTRON fiat currency rails'
          git push origin HEAD:main
