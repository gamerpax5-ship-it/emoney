name: One-off repair digiRupee UI rebase

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneoff-repair-digirupee-ui-rebase.yml'

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore latest functional V6.1 sources
        run: |
          git show ef48ff62246af89d28882eb634b6cdf7c6d20a58:android/app/src/main/java/com/loktron/tronpay/MainActivity.java > android/app/src/main/java/com/loktron/tronpay/MainActivity.java
          git show ef48ff62246af89d28882eb634b6cdf7c6d20a58:ui/digirupee-layout-v3.js > ui/digirupee-layout-v3.js

      - name: Apply UI-only safe area and compact layout polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('ui/digirupee-layout-v3.js')
          s = p.read_text(encoding='utf-8')

          old = '''      body.digi-layout-v61 #sell>*:not(#v61root){display:none!important}
                body.digi-layout-v61 .statusbar{display:none!important}
                body.digi-layout-v61 .app{width:min(430px,100%)!important;height:100%!important;grid-template-rows:auto minmax(0,1fr) var(--nav)!important;overflow:hidden!important;margin:auto!important}
                body.digi-layout-v61.digi-legacy-insets .app{padding-top:24px!important;box-sizing:border-box!important}
                body.digi-layout-v61 .header{grid-row:1!important;padding:12px 16px 8px!important;min-height:64px!important}
                body.digi-layout-v61 .page{grid-row:2!important;padding:0 16px 14px!important;overflow-y:auto!important;min-height:0!important}
                body.digi-layout-v61 .app>.nav{grid-row:3!important;position:static!important;height:var(--nav)!important}
          '''
          old = old.replace('                ', '      ')
          new = '''      html,body{height:100%;min-height:100%;overflow:hidden;background:#000!important}
                body.digi-layout-v61{--digi-safe-top:env(safe-area-inset-top,0px);--digi-safe-bottom:env(safe-area-inset-bottom,0px)}
                body.digi-layout-v61 #sell>*:not(#v61root){display:none!important}
                body.digi-layout-v61 .statusbar{display:none!important}
                body.digi-layout-v61.digi-legacy-insets{--digi-safe-top:max(28px,env(safe-area-inset-top,0px))}
                body.digi-layout-v61 .app{width:min(430px,100%)!important;height:100vh!important;height:100dvh!important;grid-template-rows:auto minmax(0,1fr) calc(var(--nav) + var(--digi-safe-bottom))!important;overflow:hidden!important;margin:auto!important}
                body.digi-layout-v61 .header{grid-row:1!important;padding:calc(12px + var(--digi-safe-top)) 16px 8px!important;min-height:calc(64px + var(--digi-safe-top))!important;box-sizing:border-box!important;background:#050607!important}
                body.digi-layout-v61 .header-copy{min-width:0}
                body.digi-layout-v61 .header-copy h1{font-size:25px!important;line-height:1.08!important}
                body.digi-layout-v61 .header-copy p{font-size:10.5px!important;line-height:1.3!important}
                body.digi-layout-v61 .page{grid-row:2!important;padding:0 16px calc(14px + var(--digi-safe-bottom))!important;overflow-y:auto!important;min-height:0!important;box-sizing:border-box!important;overscroll-behavior:contain}
                body.digi-layout-v61 .app>.nav{grid-row:3!important;position:static!important;height:calc(var(--nav) + var(--digi-safe-bottom))!important;padding-bottom:var(--digi-safe-bottom)!important;box-sizing:border-box!important}
          '''
          new = new.replace('                ', '      ')
          if old not in s:
              raise SystemExit('safe-area base block not found exactly once')
          s = s.replace(old, new, 1)

          css_anchor = '''      .v61filters .active{color:#f0ce65;border-color:#6b5924}
                @media(max-width:370px){
          '''.replace('                ', '      ')
          css_extra = '''      .v61filters .active{color:#f0ce65;border-color:#6b5924}
                .v61routebox{padding:9px 10px}
                .v61routerow{align-items:flex-start!important;flex-wrap:wrap}
                .v61routecopy{min-width:0;flex:1 1 150px}
                .v61routecopy small{display:block;margin-top:3px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
                .v61routeactions{flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end}
                #profile .digi-profile-history{margin:8px 0 16px}
                #profile .section:has(+ .profile-method-list){margin-top:12px;margin-bottom:6px;min-height:30px}
                #profile .method-toolbar{gap:5px}
                #profile .method-toolbar .manage-btn,#profile .method-toolbar button{min-height:30px!important;padding:0 8px!important;font-size:8.5px!important}
                #profile .profile-method-list{gap:6px;margin-top:-2px}
                #profile .profile-method-row{grid-template-columns:minmax(0,1fr) 36px;gap:8px;padding:8px 9px;border-radius:10px;min-height:0}
                #profile .profile-method-copy{min-width:0;line-height:1.2}
                #profile .profile-method-copy b{font-size:10.8px;line-height:1.2}
                #profile .profile-method-copy small{font-size:8.9px;line-height:1.25;margin-top:2px}
                #profile .profile-method-copy span{font-size:8.3px;line-height:1.25;margin-top:3px}
                #profile .profile-method-row .toggle{width:34px;height:20px;margin:0;flex:none}
                #profile .profile-method-row .toggle:after{width:14px;height:14px;left:3px;top:3px}
                #profile .profile-method-row .toggle.on:after{left:17px}
                @media(max-width:370px){
          '''.replace('                ', '      ')
          if css_anchor not in s:
              raise SystemExit('responsive CSS anchor missing')
          s = s.replace(css_anchor, css_extra, 1)

          start = s.index('  function routingCard(type) {')
          end = s.index('\n  function amountUiState(type)', start)
          block = s[start:end]
          before = block
          block = block.replace('return `<div class="v61box">', 'return `<div class="v61box v61routebox">', 1)
          block = block.replace('<div class="v61row">\n        <div>', '<div class="v61row v61routerow">\n        <div class="v61routecopy">', 1)
          block = block.replace('<div class="v61actions">', '<div class="v61actions v61routeactions">', 1)
          if block == before or 'v61routebox' not in block or 'v61routeactions' not in block:
              raise SystemExit('routing card UI markers were not applied')
          s = s[:start] + block + s[end:]

          mobile_anchor = '''        .v61dep,.v61bank{grid-template-columns:1fr}
                }
          '''.replace('                ', '      ')
          mobile_new = '''        .v61dep,.v61bank{grid-template-columns:1fr}
                .v61routeactions{width:100%;justify-content:flex-start}
                .v61routeactions .v61switch,.v61routeactions .v61pill{margin-right:auto}
                }
          '''.replace('                ', '      ')
          if mobile_anchor not in s:
              raise SystemExit('mobile CSS anchor missing')
          s = s.replace(mobile_anchor, mobile_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate UI-only repair
        run: |
          node --check ui/digirupee-layout-v3.js
          node --check ui/digirupee-rewards.js
          node --check website/server.mjs
          node - <<'NODE'
          const fs = require('fs');
          const layout = fs.readFileSync('ui/digirupee-layout-v3.js','utf8');
          const main = fs.readFileSync('android/app/src/main/java/com/loktron/tronpay/MainActivity.java','utf8');
          const rewards = fs.readFileSync('ui/digirupee-rewards.js','utf8');
          const requiredLayout = [
            'body.digi-layout-v61',
            '--digi-safe-top',
            'v61routebox',
            'v61routeactions',
            'profile-method-row',
            'function toggleUpi()',
            'window.__digiSaveBankAllocations',
            'do not rebuild #v61root here',
            'window.__digiLayoutV61'
          ];
          for (const marker of requiredLayout) if (!layout.includes(marker)) throw new Error(`missing layout marker: ${marker}`);
          if (layout.includes('window.__digiLayoutV5')) throw new Error('old V5 layout architecture still present');
          for (const marker of ['FrameLayout rootView','displayCutout()','digiRupee/1.0.5']) if (!main.includes(marker)) throw new Error(`missing MainActivity marker: ${marker}`);
          if (main.includes('digiRupee/1.0.4')) throw new Error('MainActivity regressed to 1.0.4');
          if (!rewards.includes('<i aria-hidden="true"></i>LIVE BONUS NEWS')) throw new Error('reward news cleanup missing');
          console.log('UI-only source guards passed.');
          NODE
          git diff --exit-code HEAD -- website/server.mjs ui/digirupee-app.js
          npm run prepare-assets
          node --check website/digirupee-layout-v3.js
          node --check website/digirupee-rewards.js
          grep -q 'window.__digiLayoutV61' website/digirupee-layout-v3.js
          grep -q -- '--digi-safe-top' website/digirupee-layout-v3.js
          git restore website android/app/src/main/assets/offline.html
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check

      - name: Commit validated repair and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/oneoff-repair-digirupee-ui-rebase.yml
          git add android/app/src/main/java/com/loktron/tronpay/MainActivity.java ui/digirupee-layout-v3.js
          git add -u .github/workflows/oneoff-repair-digirupee-ui-rebase.yml
          git diff --cached --check
          git commit -m "Repair digiRupee UI polish without logic regression"
          git push origin main
