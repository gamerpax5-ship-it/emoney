name: Validate mobile UI polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-mobile-ui-polish.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply UI polish
        run: python3 .github/scripts/oneoff-mobile-ui-polish.py

      - name: Validate
        run: |
          node --check ui/digirupee-app.js
          node --check ui/digirupee-layout-v3.js
          node --check ui/digirupee-rewards.js
          npm run prepare-assets
          node --check website/digirupee-app.js
          node --check website/digirupee-layout-v3.js
          node --check website/digirupee-rewards.js
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          grep -q "justify-content:flex-start;padding-top:42px" ui/digirupee-app.js
          grep -q "Readability V3: lift small supporting text" ui/digirupee-layout-v3.js
          grep -q "Readability V3: supporting reward copy" ui/digirupee-rewards.js

      - name: Keep canonical source only
        run: |
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'ui/digirupee-app.js' 'ui/digirupee-layout-v3.js' 'ui/digirupee-rewards.js' | sort)"
          test "$changed" = "$expected"

      - name: Commit validated UI and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/digirupee-app.js ui/digirupee-layout-v3.js ui/digirupee-rewards.js
          git rm .github/workflows/oneoff-mobile-ui-polish.yml .github/scripts/oneoff-mobile-ui-polish.py
          git commit -m 'Polish mobile auth and improve app typography'
          git push origin HEAD:main
