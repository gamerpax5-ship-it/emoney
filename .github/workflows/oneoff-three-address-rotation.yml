name: One-off three-address rotation validation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneoff-three-address-rotation.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed three-address rotation patch
        run: node scripts/oneoff-three-address-rotation.mjs

      - name: Syntax and policy checks
        run: |
          node --check website/server.mjs
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('website/server.mjs','utf8');
          const required = [
            "TRON_EXPIRED_ADDRESS_REUSE_MS",
            "5 * 60 * 1000",
            "cleanExpired = order.status === 'Expired' && !order.txId",
            "candidate.receivedUsdtMicros, candidate.txId",
            "do not auto-credit either",
            "expiredAddressReuseMs: tronExpiredAddressReuseMs",
            "Boot-time migration: old clean test/expired orders"
          ];
          for (const needle of required) if (!s.includes(needle)) throw new Error(`missing policy marker: ${needle}`);
          if (!s.includes("releaseDigiAddress(order, now, { confirmed: true })")) throw new Error('confirmed immediate release missing');
          console.log('Three-address rotation policy checks passed.');
          NODE

      - name: Run real three-address integration test
        run: node --test tests/digirupee-pool-flow.test.mjs

      - name: Commit validated source and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/oneoff-three-address-rotation.yml
          rm scripts/oneoff-three-address-rotation.mjs
          git add website/server.mjs
          git add -u .github/workflows/oneoff-three-address-rotation.yml scripts/oneoff-three-address-rotation.mjs
          git diff --cached --check
          git commit -m "Keep digiRupee three-address pool rotating safely"
          git push origin main
