name: Validate wheel reward defaults

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-wheel-defaults.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply wheel defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('website/digirupee-admin.html')
          s = admin.read_text(encoding='utf-8')
          old = "function defaultWheelSegments() { return Array.from({ length:8 }, (_,index) => ({ id:`sector_${index+1}`, label:`Prize ${index+1}`, rewardAmount:'0', probabilityWeight:1, enabled:true })); }\n      function normalizedWheelSegments(config) { const source = Array.isArray(config?.segments) && config.segments.length === 8 ? config.segments : defaultWheelSegments(); return source.map((item,index) => ({ id:String(item.id || `sector_${index+1}`), label:String(item.label || `Prize ${index+1}`), rewardAmount:String(item.rewardAmount ?? formatRewardMicros(item.rewardAmountMicros)), probabilityWeight:Number.isFinite(Number(item.probabilityWeight)) ? Number(item.probabilityWeight) : 1, enabled:item.enabled !== false })); }"
          new = "function defaultWheelSegments() { const rewards=[1,3,5,6,8,10,12,15]; const weights=[20,18,16,14,12,10,6,4]; return rewards.map((reward,index) => ({ id:`sector_${index+1}`, label:`${reward} USDT`, rewardAmount:String(reward), probabilityWeight:weights[index], enabled:true })); }\n      function normalizedWheelSegments(config) { const current = Array.isArray(config?.segments) ? config.segments : []; const legacyPlaceholder = current.length === 8 && current.every((item,index) => String(item.id || '') === `sector_${index+1}` && Number(item.rewardAmount ?? formatRewardMicros(item.rewardAmountMicros)) === 0 && Number(item.probabilityWeight) === 1); const source = current.length === 8 && !legacyPlaceholder ? current : defaultWheelSegments(); return source.map((item,index) => ({ id:String(item.id || `sector_${index+1}`), label:String(item.label || `${item.rewardAmount ?? formatRewardMicros(item.rewardAmountMicros)} USDT`), rewardAmount:String(item.rewardAmount ?? formatRewardMicros(item.rewardAmountMicros)), probabilityWeight:Number.isFinite(Number(item.probabilityWeight)) ? Number(item.probabilityWeight) : defaultWheelSegments()[index].probabilityWeight, enabled:item.enabled !== false })); }"
          if old not in s:
              raise SystemExit('admin wheel defaults target not found')
          s = s.replace(old, new, 1)
          s = s.replace('Higher weight means that sector is selected more often.', 'Higher weight means that sector is selected more often. Current defaults make 1–10 USDT land about 90% of spins, while 12 and 15 USDT stay rarer.', 1)
          admin.write_text(s, encoding='utf-8')

          server = Path('website/server.mjs')
          t = server.read_text(encoding='utf-8')
          marker = "function ensureDigiReferralCodes() {"
          helper = """const defaultDigiWheelRewards = [1, 3, 5, 6, 8, 10, 12, 15];
const defaultDigiWheelWeights = [20, 18, 16, 14, 12, 10, 6, 4];
function defaultDigiWheelSegments() {
  return defaultDigiWheelRewards.map((reward, index) => ({
    id: `sector_${index + 1}`,
    label: `${reward} USDT`,
    rewardAmountMicros: reward * 1_000_000,
    probabilityWeight: defaultDigiWheelWeights[index],
    enabled: true
  }));
}

function ensureDigiWheelDefaults() {
  const config = db.digirupee?.wheelConfig;
  if (!config) return false;
  const segments = Array.isArray(config.segments) ? config.segments : [];
  const legacyPlaceholder = segments.length === 8 && segments.every((segment, index) =>
    String(segment.id || '') === `sector_${index + 1}` &&
    Number(segment.rewardAmountMicros || 0) === 0 &&
    Number(segment.probabilityWeight || 0) === 1
  );
  if (segments.length && !legacyPlaceholder) return false;
  config.segments = defaultDigiWheelSegments();
  config.updatedAt = Date.now();
  return true;
}

"""
          if marker not in t:
              raise SystemExit('server helper insertion target not found')
          t = t.replace(marker, helper + marker, 1)
          old_boot = "  ensureDigiReferralCodes(),\n  ensureDigiAddressAssignments(),"
          new_boot = "  ensureDigiReferralCodes(),\n  ensureDigiWheelDefaults(),\n  ensureDigiAddressAssignments(),"
          if old_boot not in t:
              raise SystemExit('boot migration target not found')
          t = t.replace(old_boot, new_boot, 1)
          server.write_text(t, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check website/server.mjs
          npm run prepare-assets
          node --check website/digirupee-app.js
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          grep -q "const rewards=\[1,3,5,6,8,10,12,15\]" website/digirupee-admin.html
          grep -q "const weights=\[20,18,16,14,12,10,6,4\]" website/digirupee-admin.html
          grep -q "ensureDigiWheelDefaults()" website/server.mjs

      - name: Keep canonical changes only
        shell: bash
        run: |
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'website/digirupee-admin.html' 'website/server.mjs' | sort)"
          test "$changed" = "$expected"

      - name: Commit validated changes and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/digirupee-admin.html website/server.mjs
          git rm .github/workflows/oneoff-wheel-defaults.yml
          git commit -m 'Set digiRupee wheel rewards and weighted odds'
          git push origin HEAD:main
