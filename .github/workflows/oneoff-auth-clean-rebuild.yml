name: Clean rebuild digiRupee auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-auth-clean-rebuild.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply clean auth patch
        run: python3 .github/scripts/oneoff-auth-clean.py

      - name: Validate
        run: |
          node --check ui/digirupee-app.js
          node --check scripts/prepare-assets.mjs
          npm run prepare-assets
          node --check website/digirupee-app.js
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          grep -q 'digi-usdt-logo' ui/digirupee-app.js
          test "$(grep -c 'Private by design' ui/digirupee-app.js || true)" = "0"
          test "$(grep -c 'Move value' ui/digirupee-app.js || true)" = "0"
          test "$(grep -c 'TRC20</b> network ready' ui/digirupee-app.js || true)" = "0"
          test "$(grep -c 'Encrypted session' ui/digirupee-app.js || true)" = "0"
          grep -q 'digirupee-app.js?v=20260915b' scripts/prepare-assets.mjs

      - name: Keep canonical changes only
        run: |
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'scripts/prepare-assets.mjs' 'ui/digirupee-app.js' | sort)"
          test "$changed" = "$expected"

      - name: Commit clean auth and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/digirupee-app.js scripts/prepare-assets.mjs
          git rm .github/workflows/oneoff-auth-clean-rebuild.yml .github/scripts/oneoff-auth-clean.py
          git commit -m 'Rebuild digiRupee auth screen cleanly'
          git push origin HEAD:main
