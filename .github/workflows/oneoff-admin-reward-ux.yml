name: Validate admin rewards UX and auth boot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-admin-reward-ux.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: node .github/scripts/admin-reward-ux.mjs

      - name: Validate syntax and generated app
        shell: bash
        run: |
          node --check ui/digirupee-app.js
          node --check scripts/prepare-assets.mjs
          node --check website/server.mjs
          python3 - <<'PY'
          from pathlib import Path
          html = Path('website/digirupee-admin.html').read_text(encoding='utf-8')
          script = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/digirupee-admin-inline.js').write_text(script, encoding='utf-8')
          assert 'wheelSegmentsGrid' in html
          assert 'Eligibility JSON' not in html
          assert 'Requirements JSON' not in html
          assert 'quickToggleWheel' in html
          PY
          node --check /tmp/digirupee-admin-inline.js
          npm run prepare-assets
          cmp -s ui/digirupee-app.js website/digirupee-app.js
          grep -q 'digi-boot-guard' website/digirupee-app.html
          grep -q 'body:not(.digi-ready)' website/digirupee-app.html
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check

      - name: Keep only canonical changes
        shell: bash
        run: |
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/prepare-assets.mjs ui/digirupee-app.js website/digirupee-admin.html | sort)"
          test "$changed" = "$expected"

      - name: Commit validated changes and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-assets.mjs ui/digirupee-app.js website/digirupee-admin.html
          git rm .github/scripts/admin-reward-ux.mjs .github/workflows/oneoff-admin-reward-ux.yml
          git commit -m 'Simplify reward admin controls and remove auth flash'
          git push origin HEAD:main
