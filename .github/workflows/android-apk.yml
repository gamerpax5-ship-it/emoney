name: Build eMoney Android APK

on:
  push:
    branches: [ main, emoney-rebrand ]
    paths:
      - 'android/**'
      - 'ui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'website/persistent-start.mjs'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'website/persistent-start.mjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIGIRUPEE_WEB_APP_URL: https://emoney-production-3e0a.up.railway.app/
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Test backend and digiRupee flows
        run: npm test

      - name: Verify digiRupee branding and live URL config
        run: |
          test -s android/app/src/main/res/drawable-nodpi/digirupee_logo.webp
          grep -q 'eMoney' android/app/src/main/res/values/strings.xml
          grep -q 'ic_emoney' android/app/src/main/AndroidManifest.xml
          grep -q 'WEB_APP_URL' android/app/build.gradle.kts
          test -s android/app/src/main/assets/wtron-parts/part-000
          grep -q 'digirupee-app.html' android/app/src/main/java/com/loktron/tronpay/MainActivity.java
          ! grep -q 'wtron.html' android/app/src/main/java/com/loktron/tronpay/MainActivity.java

      - name: Prepare hosted digiRupee app and offline asset
        run: |
          npm run prepare-assets
          node scripts/prepare-emoney.mjs

      - name: Verify production app has no prototype business state
        run: |
          test -s website/digirupee-app.html
          ! grep -Eiq 'Demo@12345|demo@emoney|startPreview|PREVIEW-ONLY-NOT-A-REAL' website/digirupee-app.html
          test -s website/digirupee-app.js
          test -s website/digirupee-qr.js
          ! grep -Eiq 'wtronV11|makeInitial|demoInvite|demoReferralTrade|simulateSent|simulateExpire|simulateLate|wtron\.example|rohitp|9876543210|Devid Europe' website/digirupee-app.html website/digirupee-app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform from runner SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Prepare named APK files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/eMoney-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/eMoney-release-unsigned.apk
          test -s dist/eMoney-debug.apk
          test -s dist/eMoney-release-unsigned.apk

      - name: Sign release APK when signing secrets are configured
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cp dist/eMoney-release-unsigned.apk dist/eMoney-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            dist/eMoney-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/eMoney-release-signed.apk

      - name: Prepare installable eMoney APK
        run: |
          if test -s dist/eMoney-release-signed.apk; then
            cp dist/eMoney-release-signed.apk dist/eMoney.apk
            echo "APK_PUBLICATION_MODE=signed-release" >> "$GITHUB_ENV"
          else
            cp dist/eMoney-debug.apk dist/eMoney.apk
            echo "APK_PUBLICATION_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi
          cp dist/eMoney.apk dist/digiRupee.apk
          cp dist/eMoney-debug.apk dist/digiRupee-debug.apk
          test -s dist/eMoney.apk

      - name: Report APK signing mode
        run: |
          if test "$HAS_ANDROID_SIGNING" = "true"; then
            echo "Android APK signing: protected signing secrets configured; signed release is available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android APK signing: protected signing secrets are absent; debug fallback is available for testing only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eMoney APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eMoney-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Guard public APK publication
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if test "$HAS_ANDROID_SIGNING" != "true"; then
            echo "::error::Public APK publication requires all Android signing secrets. Debug APK artifacts were retained, but no production APK will be published."
            exit 1
          fi

      - name: Publish website APK download
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_ANDROID_SIGNING == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/eMoney.apk dist/eMoney-debug.apk dist/eMoney-release-unsigned.apk dist/digiRupee.apk dist/digiRupee-debug.apk
          if git diff --cached --quiet; then
            echo "APK files unchanged"
          else
            git commit -m "Publish digiRupee APK for subdomain download"
            git push
          fi
