name: Build digiRupee Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ui/**'
      - 'scripts/prepare-assets.mjs'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIGIRUPEE_WEB_APP_URL: https://tronpay-production.up.railway.app/
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify digiRupee branding and live URL config
        run: |
          test -s android/app/src/main/res/drawable-nodpi/digirupee_logo.webp
          grep -q 'digiRupee' android/app/src/main/res/values/strings.xml
          grep -q 'digirupee_logo' android/app/src/main/AndroidManifest.xml
          grep -q 'WEB_APP_URL' android/app/build.gradle.kts
          test -s android/app/src/main/assets/wtron-parts/part-000
          grep -q 'digirupee-app.html' android/app/src/main/java/com/loktron/tronpay/MainActivity.java
          ! grep -q 'wtron.html' android/app/src/main/java/com/loktron/tronpay/MainActivity.java

      - name: Prepare hosted digiRupee app and offline asset
        run: npm run prepare-assets

      - name: Verify production app has no prototype business state
        run: |
          test -s website/digirupee-app.html
          test -s website/digirupee-app.js
          test -s website/digirupee-qr.js
          ! grep -Eiq 'wtronV11|makeInitial|demoInvite|demoReferralTrade|simulateSent|simulateExpire|simulateLate|wtron\.example|rohitp|9876543210|Devid Europe' website/digirupee-app.html website/digirupee-app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform from runner SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Prepare named APK files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/digiRupee-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/digiRupee-release-unsigned.apk
          test -s dist/digiRupee-debug.apk
          test -s dist/digiRupee-release-unsigned.apk

      - name: Sign release APK when signing secrets are configured
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cp dist/digiRupee-release-unsigned.apk dist/digiRupee-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            dist/digiRupee-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/digiRupee-release-signed.apk

      - name: Upload digiRupee APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiRupee-apks
          path: dist/*.apk
          if-no-files-found: error
