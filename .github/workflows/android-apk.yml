name: Build digiRupee Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIGIRUPEE_WEB_APP_URL: https://tronpay-production.up.railway.app/
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify digiRupee branding and live URL config
        run: |
          test -s android/app/src/main/res/drawable-nodpi/digirupee_logo.webp
          grep -q 'digiRupee' android/app/src/main/res/values/strings.xml
          grep -q 'digirupee_logo' android/app/src/main/AndroidManifest.xml
          grep -q 'WEB_APP_URL' android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Build unsigned release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PwebAppUrl="$DIGIRUPEE_WEB_APP_URL"

      - name: Prepare named APK files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/digiRupee-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/digiRupee-release-unsigned.apk
          test -s dist/digiRupee-debug.apk
          test -s dist/digiRupee-release-unsigned.apk

      - name: Sign release APK when signing secrets are configured
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cp dist/digiRupee-release-unsigned.apk dist/digiRupee-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            dist/digiRupee-release-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/digiRupee-release-signed.apk

      - name: Upload digiRupee APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digiRupee-apks
          path: dist/*.apk
          if-no-files-found: error
