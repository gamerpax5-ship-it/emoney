name: One-off complete digiRupee Rewards page and admin

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-reward-page-admin.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: python3 .github/scripts/patch_reward_page.py

      - name: Validate changes
        shell: bash
        run: |
          node --check ui/digirupee-rewards.js
          node --check website/server.mjs
          git diff --check
          grep -q "path === '/reward-page'" website/server.mjs
          grep -q "path === '/admin/reward-page'" website/server.mjs
          grep -q 'rewardPageForm' website/digirupee-admin.html
          grep -q 'reward-v4-mascot' ui/digirupee-rewards.js
          grep -q 'assets.content' ui/digirupee-rewards.js
          npm run prepare-assets
          node --check website/digirupee-rewards.js
          grep -q 'reward-v4-mascot' website/digirupee-rewards.js
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'ui/digirupee-rewards.js\nwebsite/digirupee-admin.html\nwebsite/server.mjs'

      - name: Commit validated changes and cleanup
        shell: bash
        run: |
          rm .github/workflows/oneoff-reward-page-admin.yml
          rm .github/scripts/patch_reward_page.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/digirupee-rewards.js website/digirupee-admin.html website/server.mjs
          git add -u .github/workflows/oneoff-reward-page-admin.yml .github/scripts/patch_reward_page.py
          git diff --cached --check
          git commit -m 'Restore Rewards mascot and add admin page controls'
          git push origin HEAD:main
