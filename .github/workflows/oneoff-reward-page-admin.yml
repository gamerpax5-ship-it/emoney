name: One-off complete digiRupee Rewards page and admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-reward-page-admin.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch reward presentation and admin controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # ---------------- server ----------------
          p = Path('website/server.mjs')
          s = p.read_text(encoding='utf-8')

          old = "      referrals: { enabled: true, inviterRewardUsdt: 10, referredRewardUsdt: 0, minimumCompletedUsdt: 0 }"
          new = """      referrals: { enabled: true, inviterRewardUsdt: 10, referredRewardUsdt: 0, minimumCompletedUsdt: 0 },
      rewardPage: {
        showMascot: true,
        showCoins: true,
        heroKicker: 'BONUS ZONE',
        heroTitle: 'Play More.\\nEarn More.',
        heroSubtitle: 'Daily rewards, referrals and campaign tasks—powered by your real account activity.',
        liveNewsEnabled: true,
        liveNewsText: '',
        zones: { newuser: true, invite: true, tasks: true, events: true }
      }"""
          s = replace_once(s, old, new, 'default reward page config')

          old = """          referrals: {
            ...structuredClone(defaultData.digirupee.config.referrals),
            ...(((parsed.digirupee || {}).config || {}).referrals || {})
          }
"""
          new = """          referrals: {
            ...structuredClone(defaultData.digirupee.config.referrals),
            ...(((parsed.digirupee || {}).config || {}).referrals || {})
          },
          rewardPage: {
            ...structuredClone(defaultData.digirupee.config.rewardPage),
            ...(((parsed.digirupee || {}).config || {}).rewardPage || {}),
            zones: {
              ...structuredClone(defaultData.digirupee.config.rewardPage.zones),
              ...((((parsed.digirupee || {}).config || {}).rewardPage || {}).zones || {})
            }
          }
"""
          s = replace_once(s, old, new, 'reward page load merge')

          anchor = "  if (req.method === 'GET' && path === '/rewards') {"
          route = """  if (req.method === 'GET' && path === '/reward-page') {
    digirupeeAuth(req);
    return send(res, 200, { config: structuredClone(db.digirupee.config.rewardPage) });
  }

"""
          if route.strip() not in s:
              s = replace_once(s, anchor, route + anchor, 'public reward page route')

          anchor = "  if (req.method === 'GET' && path === '/admin/wheel') {"
          admin_routes = """  if (req.method === 'GET' && path === '/admin/reward-page') {
    const admin = adminAuth(req);
    return send(res, 200, { admin: { email: admin.email, role: admin.role }, config: structuredClone(db.digirupee.config.rewardPage) });
  }

  if (req.method === 'PATCH' && path === '/admin/reward-page') {
    const admin = adminAuth(req); requireAdminRole(admin, ['owner']); const b = await body(req);
    const current = db.digirupee.config.rewardPage || structuredClone(defaultData.digirupee.config.rewardPage);
    const zonesIn = b.zones && typeof b.zones === 'object' ? b.zones : {};
    const flag = (value, fallback) => typeof value === 'boolean' ? value : fallback;
    const clean = (value, fallback, max) => {
      const text = String(value ?? fallback ?? '').replace(/\\r/g, '').trim().slice(0, max);
      return text || String(fallback || '').slice(0, max);
    };
    const next = {
      showMascot: flag(b.showMascot, current.showMascot !== false),
      showCoins: flag(b.showCoins, current.showCoins !== false),
      heroKicker: clean(b.heroKicker, current.heroKicker || 'BONUS ZONE', 40),
      heroTitle: clean(b.heroTitle, current.heroTitle || 'Play More.\\nEarn More.', 100),
      heroSubtitle: clean(b.heroSubtitle, current.heroSubtitle || '', 220),
      liveNewsEnabled: flag(b.liveNewsEnabled, current.liveNewsEnabled !== false),
      liveNewsText: String(b.liveNewsText ?? current.liveNewsText ?? '').replace(/\\s+/g, ' ').trim().slice(0, 180),
      zones: {
        newuser: flag(zonesIn.newuser, current.zones?.newuser !== false),
        invite: flag(zonesIn.invite, current.zones?.invite !== false),
        tasks: flag(zonesIn.tasks, current.zones?.tasks !== false),
        events: flag(zonesIn.events, current.zones?.events !== false)
      }
    };
    db.digirupee.config.rewardPage = next;
    appendDigiAudit({ actorType: 'admin', actorId: admin.email, action: 'reward-page.configured', entityType: 'reward-page', entityId: 'config', details: { showMascot: next.showMascot, showCoins: next.showCoins, liveNewsEnabled: next.liveNewsEnabled, zones: next.zones } });
    await persist();
    return send(res, 200, { config: structuredClone(next) });
  }

"""
          if admin_routes.strip() not in s:
              s = replace_once(s, anchor, admin_routes + anchor, 'admin reward page routes')

          p.write_text(s, encoding='utf-8')

          # ---------------- rewards UI ----------------
          p = Path('ui/digirupee-rewards.js')
          s = p.read_text(encoding='utf-8')

          old = "  const $ = id => document.getElementById(id);\n"
          new = "  const $ = id => document.getElementById(id);\n  const assets = window.__DIGIRUPEE_REWARD_ASSETS || {};\n"
          s = replace_once(s, old, new, 'reward assets binding')

          old = "  const model = { rewards:null, wheel:null, campaigns:[] };"
          new = """  const defaultRewardPage = {
    showMascot:true, showCoins:true, heroKicker:'BONUS ZONE', heroTitle:'Play More.\\nEarn More.',
    heroSubtitle:'Daily rewards, referrals and campaign tasks—powered by your real account activity.',
    liveNewsEnabled:true, liveNewsText:'', zones:{newuser:true,invite:true,tasks:true,events:true}
  };
  const model = { rewards:null, wheel:null, campaigns:[], rewardPage:{...defaultRewardPage,zones:{...defaultRewardPage.zones}} };"""
          s = replace_once(s, old, new, 'reward model config')

          css_anchor = "      .reward-v4-copy{position:relative;z-index:2;max-width:62%}\n"
          css_extra = """      .reward-v4-mascot{position:absolute;z-index:1;top:0;right:0;width:57%;height:84%;overflow:hidden;pointer-events:none;opacity:.96;mask-image:linear-gradient(90deg,transparent 0,#000 28%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%,#000 100%)}
      .reward-v4-mascot img{position:absolute;top:-54px;right:-1px;width:176%;max-width:none;height:auto;filter:saturate(1.05) contrast(1.02)}
      .reward-v4-mascot.hidden,.reward-v4-coin.hidden{display:none!important}
      .reward-v4-coin{position:absolute;z-index:2;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff4a9 0,#f1c047 34%,#c98918 72%,#694009 100%);border:2px solid #f4cf63;color:#744606;font-weight:950;box-shadow:0 8px 18px #0008,0 0 18px #f5c84b35;pointer-events:none}
      .reward-v4-coin.c1{width:40px;height:40px;right:12px;top:15px;font-size:17px;transform:rotate(13deg)}
      .reward-v4-coin.c2{width:29px;height:29px;right:105px;top:27px;font-size:12px;transform:rotate(-17deg)}
      .reward-v4-coin.c3{width:24px;height:24px;right:73px;top:91px;font-size:10px;transform:rotate(21deg)}
      .reward-v4-copy{position:relative;z-index:3;max-width:62%}
"""
          s = replace_once(s, css_anchor, css_extra, 'mascot css')

          old = """      <section class=\"reward-v4-hero\">
        <div class=\"reward-v4-copy\"><span class=\"reward-v4-kicker\">BONUS ZONE</span><h2>Play More.<br>Earn More.</h2><p>Daily rewards, referrals and campaign tasks—powered by your real account activity.</p><button class=\"reward-v4-explore\" id=\"rewardV4Explore\" type=\"button\">Explore Rewards →</button></div>
        <button class=\"reward-v4-wallet\" id=\"rewardV4Wallet\" type=\"button\"><small>My Rewards</small><b id=\"rewardV4Balance\">0 USDT</b><span>View reward history ›</span></button>
      </section>
"""
          new = """      <section class=\"reward-v4-hero\">
        <div class=\"reward-v4-mascot\" id=\"rewardV4Mascot\" aria-hidden=\"true\"></div>
        <span class=\"reward-v4-coin c1\" aria-hidden=\"true\">₮</span><span class=\"reward-v4-coin c2\" aria-hidden=\"true\">₮</span><span class=\"reward-v4-coin c3\" aria-hidden=\"true\">₮</span>
        <div class=\"reward-v4-copy\"><span class=\"reward-v4-kicker\" id=\"rewardV4Kicker\">BONUS ZONE</span><h2 id=\"rewardV4HeroTitle\">Play More.<br>Earn More.</h2><p id=\"rewardV4HeroSubtitle\">Daily rewards, referrals and campaign tasks—powered by your real account activity.</p><button class=\"reward-v4-explore\" id=\"rewardV4Explore\" type=\"button\">Explore Rewards →</button></div>
        <button class=\"reward-v4-wallet\" id=\"rewardV4Wallet\" type=\"button\"><small>My Rewards</small><b id=\"rewardV4Balance\">0 USDT</b><span>View reward history ›</span></button>
      </section>
"""
          s = replace_once(s, old, new, 'reward hero markup')

          old = "    page.appendChild(root);\n\n    $('rewardV4Wallet')?.addEventListener('click', () => window.openRewardHistory?.());"
          new = """    page.appendChild(root);

    const mascot = $('rewardV4Mascot');
    if (mascot && assets.content) {
      const image = document.createElement('img');
      image.src = assets.content;
      image.alt = '';
      image.decoding = 'async';
      image.loading = 'eager';
      mascot.appendChild(image);
    }

    $('rewardV4Wallet')?.addEventListener('click', () => window.openRewardHistory?.());"""
          s = replace_once(s, old, new, 'mascot image attach')

          anchor = "  function renderBalance() {"
          fn = """  function rewardPageConfig() {
    const raw = model.rewardPage || {};
    return { ...defaultRewardPage, ...raw, zones:{ ...defaultRewardPage.zones, ...(raw.zones || {}) } };
  }

  function renderPresentation() {
    const config = rewardPageConfig();
    if ($('rewardV4Kicker')) $('rewardV4Kicker').textContent = config.heroKicker || defaultRewardPage.heroKicker;
    if ($('rewardV4HeroTitle')) {
      const lines = String(config.heroTitle || defaultRewardPage.heroTitle).split(/\\n+/).slice(0, 3);
      $('rewardV4HeroTitle').innerHTML = lines.map(esc).join('<br>');
    }
    if ($('rewardV4HeroSubtitle')) $('rewardV4HeroSubtitle').textContent = config.heroSubtitle || defaultRewardPage.heroSubtitle;
    const mascot = $('rewardV4Mascot');
    if (mascot) mascot.classList.toggle('hidden', config.showMascot === false || !assets.content);
    document.querySelectorAll('.reward-v4-coin').forEach(node => node.classList.toggle('hidden', config.showCoins === false));
    const news = $('rewardV4News'); if (news) news.hidden = config.liveNewsEnabled === false;
    document.querySelectorAll('.reward-v4-zone-card[data-zone]').forEach(button => {
      const key = button.dataset.zone;
      button.hidden = config.zones?.[key] === false;
    });
  }

"""
          if fn.strip() not in s:
              s = replace_once(s, anchor, fn + anchor, 'presentation renderer')

          old = """  function renderNews() {
    const campaigns = currentCampaigns();
    const active = campaigns.find(campaign => campaign.active !== false && !campaign.upcoming) || campaigns[0];
    if ($('rewardV4NewsText')) $('rewardV4NewsText').textContent = active?.title || 'No active bonus campaign';
    if ($('rewardV4NewsState')) $('rewardV4NewsState').textContent = active ? (active.upcoming ? 'Upcoming' : 'Active') : 'Waiting';
  }
"""
          new = """  function renderNews() {
    const config = rewardPageConfig();
    const campaigns = currentCampaigns();
    const active = campaigns.find(campaign => campaign.active !== false && !campaign.upcoming) || campaigns[0];
    const manual = String(config.liveNewsText || '').trim();
    if ($('rewardV4NewsText')) $('rewardV4NewsText').textContent = manual || active?.title || 'No active bonus campaign';
    if ($('rewardV4NewsState')) $('rewardV4NewsState').textContent = manual ? 'Admin' : active ? (active.upcoming ? 'Upcoming' : 'Active') : 'Waiting';
  }
"""
          s = replace_once(s, old, new, 'news config renderer')

          old = "  function renderAll() {\n    renderBalance(); renderNews(); renderWheelSegments(); renderSpin(); renderTasks();\n  }"
          new = "  function renderAll() {\n    renderPresentation(); renderBalance(); renderNews(); renderWheelSegments(); renderSpin(); renderTasks();\n  }"
          s = replace_once(s, old, new, 'renderAll presentation')

          old = """      const [rewards,wheel,campaigns] = await Promise.all([api('/rewards'),api('/wheel'),api('/campaigns')]);
      model.rewards = rewards; model.wheel = wheel; model.campaigns = campaigns.campaigns || [];
"""
          new = """      const [rewards,wheel,campaigns,rewardPage] = await Promise.all([api('/rewards'),api('/wheel'),api('/campaigns'),api('/reward-page')]);
      model.rewards = rewards; model.wheel = wheel; model.campaigns = campaigns.campaigns || [];
      model.rewardPage = rewardPage.config || model.rewardPage;
"""
          s = replace_once(s, old, new, 'reward page fetch')

          p.write_text(s, encoding='utf-8')

          # ---------------- admin UI ----------------
          p = Path('website/digirupee-admin.html')
          s = p.read_text(encoding='utf-8')

          old = "rewards: null, campaigns: [], taskClaims: [], wheel: null"
          new = "rewards: null, rewardPage: null, campaigns: [], taskClaims: [], wheel: null"
          s = replace_once(s, old, new, 'admin state rewardPage')

          old = "rewards: [['rewards','/admin/rewards'],['users','/admin/users']],"
          new = "rewards: [['rewards','/admin/rewards'],['users','/admin/users'],['rewardPage','/admin/reward-page']],"
          s = replace_once(s, old, new, 'admin rewards source')

          old = "        if (key === 'rewards') state.rewards = payload;\n"
          new = "        if (key === 'rewards') state.rewards = payload;\n        if (key === 'rewardPage') state.rewardPage = payload.config || null;\n"
          s = replace_once(s, old, new, 'admin rewardPage payload')

          old = "['addAddressButton','rewardAdjustButton','campaignButton','wheelButton','referralPolicyButton'].forEach(id => {\n          const el = $(id); if (el) { el.disabled = support || (['wheelButton','referralPolicyButton'].includes(id) && !owner); el.classList.toggle('role-readonly', el.disabled); }\n        });"
          new = "['addAddressButton','rewardAdjustButton','campaignButton','wheelButton','referralPolicyButton','rewardPageButton'].forEach(id => {\n          const el = $(id); if (el) { el.disabled = support || (['wheelButton','referralPolicyButton','rewardPageButton'].includes(id) && !owner); el.classList.toggle('role-readonly', el.disabled); }\n        });"
          s = replace_once(s, old, new, 'admin rewardPage role')

          campaign_anchor = "      <section class=\"content-view\" id=\"view-campaigns\">"
          panel = """      <section class=\"panel\" style=\"margin-top:13px\" id=\"rewardPagePanel\"><div class=\"panel-heading\"><h2>Reward page display</h2><span>Owner controlled presentation</span></div><form id=\"rewardPageForm\"><div class=\"notice\">This controls the Rewards page presentation only. Actual reward amounts still come from Campaigns, Daily Wheel and Referrals.</div><div class=\"form-grid\"><div class=\"field\"><label>Hero kicker</label><input class=\"input\" id=\"rewardHeroKicker\" maxlength=\"40\"></div><div class=\"field\"><label>Hero title</label><textarea class=\"textarea\" id=\"rewardHeroTitle\" maxlength=\"100\" style=\"min-height:72px\"></textarea></div><div class=\"field wide\"><label>Hero subtitle</label><textarea class=\"textarea\" id=\"rewardHeroSubtitle\" maxlength=\"220\" style=\"min-height:72px\"></textarea></div><div class=\"field wide\"><label>Live bonus news override</label><input class=\"input\" id=\"rewardLiveNewsText\" maxlength=\"180\" placeholder=\"Leave blank to use the active campaign title\"></div></div><div class=\"form-grid\"><label class=\"check\"><input id=\"rewardShowMascot\" type=\"checkbox\"> Show approved girl artwork</label><label class=\"check\"><input id=\"rewardShowCoins\" type=\"checkbox\"> Show floating coins</label><label class=\"check\"><input id=\"rewardLiveNewsEnabled\" type=\"checkbox\"> Show LIVE BONUS NEWS</label><label class=\"check\"><input id=\"rewardZoneNewUser\" type=\"checkbox\"> Show New User Bonus</label><label class=\"check\"><input id=\"rewardZoneInvite\" type=\"checkbox\"> Show Invite &amp; Earn</label><label class=\"check\"><input id=\"rewardZoneTasks\" type=\"checkbox\"> Show Complete Tasks</label><label class=\"check\"><input id=\"rewardZoneEvents\" type=\"checkbox\"> Show Special Events</label></div><div class=\"modal-footer\"><button class=\"btn primary\" id=\"rewardPageButton\" type=\"submit\">Save reward page</button></div></form></section>\n\n"""
          if panel.strip() not in s:
              s = replace_once(s, campaign_anchor, panel + campaign_anchor, 'admin reward page panel')

          old = "function renderAll() { renderOverview(); renderUsers(); renderOrders(); renderDeposits(); renderPayouts(); renderAddresses(); renderRates(); renderReviews(); renderRewards(); renderCampaigns(); renderWheel(); renderReferrals(); renderSupport(); renderNotifications(); renderAudit(); renderSettings(); }"
          new = "function renderAll() { renderOverview(); renderUsers(); renderOrders(); renderDeposits(); renderPayouts(); renderAddresses(); renderRates(); renderReviews(); renderRewards(); renderRewardPage(); renderCampaigns(); renderWheel(); renderReferrals(); renderSupport(); renderNotifications(); renderAudit(); renderSettings(); }"
          s = replace_once(s, old, new, 'admin renderAll')

          anchor = "      function renderCampaigns() {"
          fn = """      function renderRewardPage() {
        if ($('rewardPageForm')?.dataset.dirty === '1') return;
        const config = state.rewardPage || {};
        const zones = config.zones || {};
        $('rewardHeroKicker').value = config.heroKicker || 'BONUS ZONE';
        $('rewardHeroTitle').value = config.heroTitle || 'Play More.\\nEarn More.';
        $('rewardHeroSubtitle').value = config.heroSubtitle || '';
        $('rewardLiveNewsText').value = config.liveNewsText || '';
        $('rewardShowMascot').checked = config.showMascot !== false;
        $('rewardShowCoins').checked = config.showCoins !== false;
        $('rewardLiveNewsEnabled').checked = config.liveNewsEnabled !== false;
        $('rewardZoneNewUser').checked = zones.newuser !== false;
        $('rewardZoneInvite').checked = zones.invite !== false;
        $('rewardZoneTasks').checked = zones.tasks !== false;
        $('rewardZoneEvents').checked = zones.events !== false;
      }
"""
          if fn.strip() not in s:
              s = replace_once(s, anchor, fn + anchor, 'admin render reward page')

          anchor = "      async function saveWheel(event) {"
          fn = """      async function saveRewardPage(event) {
        event.preventDefault();
        const button = $('rewardPageButton'); button.disabled = true;
        try {
          const result = await api('/admin/reward-page', { method:'PATCH', body:JSON.stringify({
            showMascot:$('rewardShowMascot').checked,
            showCoins:$('rewardShowCoins').checked,
            heroKicker:$('rewardHeroKicker').value.trim(),
            heroTitle:$('rewardHeroTitle').value.replace(/\\r/g,''),
            heroSubtitle:$('rewardHeroSubtitle').value.trim(),
            liveNewsEnabled:$('rewardLiveNewsEnabled').checked,
            liveNewsText:$('rewardLiveNewsText').value.trim(),
            zones:{ newuser:$('rewardZoneNewUser').checked, invite:$('rewardZoneInvite').checked, tasks:$('rewardZoneTasks').checked, events:$('rewardZoneEvents').checked }
          }) });
          state.rewardPage = result.config || state.rewardPage;
          $('rewardPageForm').dataset.dirty = '0';
          toast('Reward page settings saved');
          renderRewardPage();
        } catch(error) { toast(error.message, true); }
        finally { button.disabled = false; applyRoleUi(); }
      }
"""
          if fn.strip() not in s:
              s = replace_once(s, anchor, fn + anchor, 'admin save reward page')

          old = "$('ratesForm').addEventListener('submit', saveRates); $('rewardAdjustForm').addEventListener('submit', adjustReward); $('campaignForm').addEventListener('submit', createCampaign); $('wheelForm').addEventListener('submit', saveWheel);"
          new = "$('ratesForm').addEventListener('submit', saveRates); $('rewardAdjustForm').addEventListener('submit', adjustReward); $('rewardPageForm').addEventListener('submit', saveRewardPage); $('campaignForm').addEventListener('submit', createCampaign); $('wheelForm').addEventListener('submit', saveWheel);"
          s = replace_once(s, old, new, 'admin rewardPage submit listener')

          old = "['ratesForm','wheelForm','referralPolicyForm'].forEach(id => {"
          new = "['ratesForm','rewardPageForm','wheelForm','referralPolicyForm'].forEach(id => {"
          s = replace_once(s, old, new, 'admin dirty rewardPage form')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate changes
        shell: bash
        run: |
          node --check ui/digirupee-rewards.js
          node --check website/server.mjs
          git diff --check
          grep -q "path === '/reward-page'" website/server.mjs
          grep -q "path === '/admin/reward-page'" website/server.mjs
          grep -q 'rewardPageForm' website/digirupee-admin.html
          grep -q 'reward-v4-mascot' ui/digirupee-rewards.js
          grep -q 'assets.content' ui/digirupee-rewards.js
          npm run prepare-assets
          node --check website/digirupee-rewards.js
          grep -q 'reward-v4-mascot' website/digirupee-rewards.js
          git restore website/digirupee-app.html website/digirupee-app.js website/digirupee-qr.js website/digirupee-rewards.js website/digirupee-rewards-assets.js website/digirupee-layout-v3.js android/app/src/main/assets/offline.html 2>/dev/null || true
          node --test tests/digirupee-pool-flow.test.mjs
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'ui/digirupee-rewards.js\nwebsite/digirupee-admin.html\nwebsite/server.mjs'

      - name: Commit validated changes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/oneoff-reward-page-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/digirupee-rewards.js website/digirupee-admin.html website/server.mjs .github/workflows/oneoff-reward-page-admin.yml
          git diff --cached --check
          git commit -m 'Restore Rewards mascot and add admin page controls'
          git push origin HEAD:main
